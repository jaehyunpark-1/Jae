function render(){const prod=product.value,reg=region.value,s=stats(records(prod,reg));document.getElementById('recent').textContent=fmt(s['최근 7일'])+' 원';document.getElementById('previous').textContent=fmt(s['직전 7일'])+' 원';const de=document.getElementById('delta');de.textContent=fmt(s.delta)+' 원';de.className='kpi '+(s.delta>0?'delta up':s.delta<0?'delta down':'delta flat');const ra=document.getElementById('rate');ra.textContent=pct(s.rate);ra.className='kpi '+(s.rate>0?'delta up':s.rate<0?'delta down':'delta flat');document.getElementById('lineChart').innerHTML=drawChart(records(prod,reg));const by=grouped(DATA.regions.filter(d=>d['제품']===prod),d=>d['지역']);const table=[],bars=[];for(const r of regions){const z=stats(by[r]||[]);table.push(`<tr><td>${r}</td><td>${fmt(z['직전 7일'])}</td><td>${fmt(z['최근 7일'])}</td><td class="${z.delta>0?'positive':'negative'}">${fmt(z.delta)}</td><td class="${z.rate>0?'positive':'negative'}">${pct(z.rate)}</td></tr>`);bars.push({r,v:z['최근 7일'],d:z.delta})}const max=Math.max(...bars.map(x=>x.v||0));document.getElementById('regionTable').innerHTML=table.join('');document.getElementById('regionBars').innerHTML=bars.map(x=>`<div class="barrow"><span>${x.r}</span><div class="bar"><div class="fill" style="width:${max?x.v/max*100:0}%"></div></div><span>${fmt(x.v)} <small class="${x.d>0?'positive':'negative'}">(${fmt(x.d)})</small></span></div>`).join('')}
